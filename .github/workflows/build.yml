name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      # The VitaOS Updater (one-press updates) ships inside VitaOS as
      # assets/updater.vpk: built from updater/ first, then bundled.
      - name: VitaOS Updater
        run: |
          mkdir updater/build && cd updater/build
          cmake ..
          make
          cp updater.vpk ../../assets/updater.vpk
      - name: Diagnose OpenSSL
        run: |
          L=$VITASDK/arm-vita-eabi/lib
          ls -l $L/libssl.a $L/libcrypto.a $L/libcurl.a
          grep -a -m1 -o "OpenSSL [0-9][0-9.]*[a-z]*" $L/libcrypto.a || true
          for s in TLS_method BIO_meth_new EVP_MD_CTX_new; do
            printf '%s: ' $s
            $VITASDK/bin/arm-vita-eabi-nm $L/libcrypto.a $L/libssl.a 2>/dev/null | grep -c " T $s" || true
          done
      - name: VitaOS
        run: |
          mkdir build && cd build
          cmake ..
          make -j"$(nproc)"
      - name: PS plugin
        run: |
          mkdir plugin/build && cd plugin/build
          cmake ..
          make
      - uses: actions/upload-artifact@v4
        with:
          name: vitaos
          path: |
            build/VitaOS.vpk
            plugin/build/vitaos_ps.suprx
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/VitaOS.vpk
            plugin/build/vitaos_ps.suprx
