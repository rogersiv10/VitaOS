name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      # Downgrade curl to a version matching OpenSSL 1.0.2 in VitaSDK
      - name: Fix curl/OpenSSL dependency mismatch
        run: |
          pacman -Syu --noconfirm
          # Forzamos la instalación/actualización limpia de los paquetes base de desarrollo
          pacman -S --noconfirm arm-vita-eabi-openssl arm-vita-eabi-curl

      # The VitaOS Updater (one-press updates) ships inside VitaOS as
      # assets/updater.vpk: built from updater/ first, then bundled.
      - name: VitaOS Updater
        run: |
          mkdir updater/build && cd updater/build
          cmake ..
          make
          cp updater.vpk ../../assets/updater.vpk

      - name: VitaOS
        run: |
          mkdir build && cd build
          cmake ..
          make -j"$(nproc)"

      - name: PS plugin
        run: |
          mkdir plugin/build && cd plugin/build
          cmake ..
          make

      - uses: actions/upload-artifact@v4
        with:
          name: vitaos
          path: |
            build/VitaOS.vpk
            plugin/build/vitaos_ps.suprx

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/VitaOS.vpk
            plugin/build/vitaos_ps.suprx
