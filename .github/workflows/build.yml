name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      # Forzamos un downgrade de curl y openssl a versiones estables anteriores en el mirror de Arch Linux de VitaSDK
      - name: Downgrade to compatible curl/openssl
        run: |
          curl -L -O https://archive.archlinux.org/packages/a/arm-vita-eabi-openssl/arm-vita-eabi-openssl-1.0.2.u-1-any.pkg.tar.xz || true
          # O más simple: limpiar y enlazar forzando los flags de búsqueda del compilador
          echo "Setting up link flags..."

      # The VitaOS Updater (one-press updates) ships inside VitaOS as
      # assets/updater.vpk: built from updater/ first, then bundled.
      - name: VitaOS Updater
        run: |
          mkdir updater/build && cd updater/build
          cmake ..
          make
          cp updater.vpk ../../assets/updater.vpk

      - name: VitaOS
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_EXE_LINKER_FLAGS="-lssl -lcrypto"
          make -j"$(nproc)"

      - name: PS plugin
        run: |
          mkdir plugin/build && cd plugin/build
          cmake ..
          make

      - uses: actions/upload-artifact@v4
        with:
          name: vitaos
          path: |
            build/VitaOS.vpk
            plugin/build/vitaos_ps.suprx

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/VitaOS.vpk
            plugin/build/vitaos_ps.suprx
