name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:2024-05-13
    steps:
      - uses: actions/checkout@v4

      - name: OpenSSL 1.0.2
        run: |
          apt-get update && apt-get install -y wget make gcc
          wget https://github.com/openssl/openssl/archive/OpenSSL_1_0_2u.tar.gz
          tar xf OpenSSL_1_0_2u.tar.gz
          cd openssl-OpenSSL_1_0_2u
          ./Configure dist --prefix=$VITASDK/arm-vita-eabi
          make build_libs
          cp libcrypto.a libssl.a $VITASDK/arm-vita-eabi/lib/

      # The VitaOS Updater (one-press updates) ships inside VitaOS as
      # assets/updater.vpk: built from updater/ first, then bundled.
      - name: VitaOS Updater
        run: |
          mkdir updater/build && cd updater/build
          cmake ..
          make
          cp updater.vpk ../../assets/updater.vpk

      - name: VitaOS
        run: |
          mkdir build && cd build
          cmake ..
          make -j"$(nproc)"

      - name: PS plugin
        run: |
          mkdir plugin/build && cd plugin/build
          cmake ..
          make

      - uses: actions/upload-artifact@v4
        with:
          name: vitaos
          path: |
            build/VitaOS.vpk
            plugin/build/vitaos_ps.suprx

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/VitaOS.vpk
            plugin/build/vitaos_ps.suprx
